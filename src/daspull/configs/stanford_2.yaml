quality:
  channel_coordinates: partial
  known_issues:
  - Only channels ~399-750 (Sandhill Road section) are tap-test calibrated. The shipped geometry file covers just that range though all 1250 channels are recorded. Quality is degraded outside that range.
  - Daily subdirectories (Data/YYYYMMDD/) key to the local Pacific calendar day, not UTC, so each directory's files span ~06:58/05:58 UTC (PST/PDT) through the same clock time on the following UTC day.
  - A handful of files per day are shorter than the standard 60 s block, consistent with small gaps at some day boundaries (e.g. 2020-03-02, 03-03, 03-06, 03-07, 03-09, 03-13, 03-14).
