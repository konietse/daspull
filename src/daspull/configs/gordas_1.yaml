quality:
  channel_coordinates: none
  known_issues:
  - Not a continuous archive (21 per-event windows from the spring 2022 Arcata-to-Eureka deployment) 147 files of 60 s each, one directory per earthquake, covering ~5 min before to 2 min after origin time. Time-range selection only ever matches inside those windows.
  - Unlike GorDAS-2/MARS in the same repo, these files are not in the repo's documented "DAS event format". They're the interrogator's own PRODML/OptaSense HDF5 layout (`/Acquisition/Raw[0]/RawData`, int32), raw optical phase in `rad * 2PI/2^16`, no event attributes at all, and undescribed by the repo's README. Converting to strain rate is left to the user.
  - The README documents only "arcata", "monterey_bay", and "ridgecrest_north". This "eureka" subset is matched to the USGS Spring 2022 Arcata-to-Eureka release (10.5066/P9NYAT5Z) by date/geometry, not an explicit statement in the repo.
  - Interrogator named "OptaSense QuantX" here (per the GorDAS description). Files record only VendorCode "OptaSense IU Setup 1.8.6", and the README calls it "Luna QuantX" (Luna acquired OptaSense 2020).
  - The cable_length_m value is derived (7,590 loci x 2.042 m = 15,498 m, from the files' own attributes), not published. GorDAS-2 re-bins the same fiber into 7,550/3,020 channels over an almost identical 15.4 km span.
  - No per-channel geodetic coordinates published .Fiber route (Arcata to Eureka, owned by Vero Communications) described only in prose.
  - Repo is a mutable git branch (`main`). Tile count/size can change under it, pin a commit SHA for a reproducible catalog.
