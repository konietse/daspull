quality:
  channel_coordinates: partial
  known_issues:
  - Shares its geometry file with Stanford-1 (Stanford-1-Campus-geometry.csv), which geolocates only 620 of the cable's channels.
  - Temporary dual-interrogator experiment (2017-10-05 to 10-13 per the PubDAS paper) on Stanford-1's cable loop. An existing OptaSense ODH-3 (published separately as Stanford-1) and a newly attached ODH-4 recorded concurrently for the first ~3 days, only the ODH-4 side is published here.
  - The three "default gauge" runs have no numeric gauge length in the files (SEG-Y textual headers ship blank) or directory names. 7.14 m here is from the PubDAS paper (ODH-4 started "using acquisition parameters identical to the ODH-3," i.e. Stanford-1's gauge). Channel spacing (8.16 m) is constant across all five and also from the PubDAS paper, not the files.
  - A separate 2500 Hz "Active Settings" run also happened per the operational log but isn't in this SEG-Y tree.
  - ~2-3 h gaps exist between subdirectories where settings were switched.
  - Dataset root also includes companion GM-network (AC06/AC07/AC08) miniSEED under Data/GM_ACs/, counted in the total size but not DAS data.
