quality:
  channel_coordinates: none
  known_issues:
  - Not the year-long SeaFOAM archive 33 individual 60 s ML-excerpt windows (2022-07 to 2024-12). Time-range selection only ever matches inside them.
  - All 33 files cover only the inshore 2,845 channels of the full 52 km/ 10,245-channel SeaFOAM array. `number_of_channels`/`cable_length_m` here describe just this subset (2,845 x 5.2 m = 14,794 m).
  - Channel spacing (5.2 m) is each file's own `dx_m`. The SeaFOAM paper reports 5.1 m. Gauge length (20.4 m) is from the paper; files' `event_id` round it to "GL20m".
  - All 33 files have an empty `event_time` and `event_time_index` of -1, so despite the event-format repo they aren't centred on a catalogued earthquake. Magnitude/location-based selection isn't possible here.
  - Files' `event_id` names two configs ("...GL20m..." vs "...F8_STU_GL20m..."), but recorded geometry is identical in all 33.
  - Repo is a mutable git branch (`main`); file count/size can change under it. Pin a commit SHA for a reproducible catalog.
