quality:
  channel_coordinates: partial
  known_issues:
  - The cable loop turns around near channel 315, so the array is roughly mirrored about that channel. Channels on either side don't sit at identical positions and stagger relative to one another (per the dataset readme).
  - Recording isn't uniformly continuous across the 940-day span. Daily SEG-Y file counts vary widely (up to the nominal 1,440 one-minute blocks/day), reflecting acquisition interruptions.
  - The geometry CSV geolocates channels 1-620 of 626. The last few channels aren't covered.
