quality:
  channel_coordinates: none
  known_issues:
  - Not a continuous archive 2,470 per-event windows (2022-12 to 2024-12), one file per window. Time-range selection only ever matches inside them.
  - Window length isn't in the filename and is bimodal sampling 100 HDF5 headers found 59 windows of 420 s and 41 of 120 s, with no pattern the filename exposes. daspull assumes the longest (420 s) for every file, so a query never misses one but may select a 120 s file up to 5 minutes past its real end (`--list-intervals` overstates the same way). The filename's start timestamp itself is exact (matches `begin_time`).
  - Two acquisition configs share the catalog (hence the required --sampling-rate/--channel-spacing) 7,550 ch @ 2.0419 m, 125 Hz (downsampled from 250 Hz) through 2023-02-02 22:13:15; 3,020 ch @ 5.1048 m, 100 Hz (not downsampled) from 2023-02-03 00:42:04 on. Verified via HDF5 headers of the first 857 files plus a sampled sweep through 2024-12-31, exactly one switch. Both window lengths occur in both configs. `data.downsampled`/`original_sampling_rate_hz` describe the first config only.
  - 41 of 100 sampled files carry no `event_time`/`event_id`/`magnitude`, so magnitude/location-based selection isn't possible from the catalog alone.
  - Sibling `arcata/phasenet/` and `arcata/phasenet_das/` prefixes hold model output (phase picks), not DAS data, and aren't part of this config.
  - No per-channel geodetic coordinates published; fiber route (Arcata to Eureka, owned by Vero Communications) described only in prose.
  - Interrogator named "OptaSense QuantX" here (per the GorDAS description). Tthe repo's README calls it "Luna QuantX" (Luna acquired OptaSense 2020).
  - Repo is a mutable git branch (`main`); the underlying USGS release is itself versioned (v3.0, 2026-02). File count/size can change under it, pin a commit SHA for a reproducible catalog.
