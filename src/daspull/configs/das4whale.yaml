quality:
  channel_coordinates: partial
  known_issues:
  - Shares the Svalbard OptoDAS array/cable with PubDAS's DAS4Microseism release, but publishes only 3 short excerpts around whale-call events, not a continuous deployment.
  - The 3 windows (2020-06-27 05:24:41-05:27:21, 2020-06-27 19:22:55-19:28:05, 2020-07-16 15:43:02-15:55:02 UTC) are each split across files by channel range. Duration is per-file in the filename's L<seconds>s suffix (160/310/720 s), not constant.
  - No exact fiber lat/lon is published (route is proprietary to Uninett AS). Each file gives channel number and along-cable distance from shore instead.
  - Gauge length is recorded per file (`info_GL_m`) rather than one declared value. 8.16 m here is Bouffaut et al. (2022)'s stated design value for this array, not independently verified against each file's attribute.
  - Files are MATLAB structs (`scipy.io.loadmat`) bundling data with channel/ position/time metadata; no separate geometry file.
