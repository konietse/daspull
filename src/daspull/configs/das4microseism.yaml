quality:
  channel_coordinates: partial
  known_issues:
  - Only a curated subset of the continuous 44-day deployment is published, not the full continuous recording. The published subset includes 520 hourly 5-minute (300 s) snapshots (2020-07-05 to 07-27, channels 1050-18000) plus four 20-minute (1200 s) example files (2020-07-22, channels 1-5000 in two splits).
  - Resampled from ~1.55 ms (~645 Hz) to 20 ms (50 Hz, Nyquist 25 Hz) with an 80% antialiasing filter, and decimated from 1.02 m raw channel spacing to the published 4.08 m, to reduce file size.
  - No exact fiber lat/lon is published (route is proprietary to Uninett AS). Each file gives along-cable distance from shore and water depth per channel instead.
  - Files are MATLAB structs (`scipy.io.loadmat`) bundling data with channel/position/time metadata. No separate geometry file.
  - The dataset's Jobs/ directory ships processing scripts, not DAS data. It sits outside primary_root and is never selected.
