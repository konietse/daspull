quality:
  channel_coordinates: partial
  known_issues:
  - Downsampled on PubDAS from 1000 Hz to 250 Hz via a 10th-order Chebyshev type I low-pass filter (below 125 Hz) to reduce repository volume.
  - Original hour-long interrogator files were truncated into six 10-minute HDF5 files each. Filenames encode each block's UTC start time.
  - The readme and the PubDAS paper claim only 2020-09-01 to 09-07 is continuous/published (the second week allegedly unpublished due to gaps), but the live catalog actually contains hourly directories through ~2020-09-08 16:05 UTC plus one isolated 20-minute block on 09-15 07:36-07:56 UTC; treat data outside 09-01 to 09-07 as unverified/gappy.
  - Only channels 510-2977 (submarine section) have precise per-channel coordinates (DAS-1-geometry-Valencia-undersea.csv). The on-land section (channels 1-509, first 9189 m) is documented only by a KMZ cable path.
